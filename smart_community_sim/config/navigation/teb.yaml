base_local_planner: teb_local_planner/TebLocalPlannerROS
TebLocalPlannerROS:
  odom_topic: /odom
  map_frame: map
  max_vel_x: 0.18
  max_vel_x_backwards: 0.18
  max_vel_y: 0.18
  max_vel_theta: 0.5
  acc_lim_x: 0.30
  acc_lim_y: 0.30
  acc_lim_theta: 0.6
  min_turning_radius: 0.0
  cmd_angle_instead_rotvel: false
  footprint_model:
    type: polygon
    vertices: [[0.20, 0.18], [0.20, -0.18], [-0.20, -0.18], [-0.20, 0.18]]
  xy_goal_tolerance: 0.02
  yaw_goal_tolerance: 0.06
  free_goal_vel: false
  trans_stopped_vel: 0.025
  theta_stopped_vel: 0.05
  penalty_epsilon: 0.01
  dt_ref: 0.2
  dt_hysteresis: 0.05
  min_samples: 5
  max_samples: 100
  global_plan_overwrite_orientation: false
  max_global_plan_lookahead_dist: 1.2
  feasibility_check_no_poses: 8
  # Polygon already includes 1 cm footprint padding. Another 3 cm clearance
  # leaves no room for a diagonal heading in the 60 cm lanes after rasterizing.
  min_obstacle_dist: 0.01
  inflation_dist: 0.08
  include_costmap_obstacles: true
  include_dynamic_obstacles: false
  costmap_obstacles_behind_robot_dist: 0.4
  obstacle_poses_affected: 10
  weight_kinematics_nh: 0.0
  weight_kinematics_forward_drive: 0.0
  weight_optimaltime: 1.0
  weight_obstacle: 50.0
  enable_homotopy_class_planning: false
  no_inner_iterations: 5
  no_outer_iterations: 4
  optimization_verbose: false
